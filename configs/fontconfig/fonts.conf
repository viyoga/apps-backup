<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Maple Mono NF</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Maple Mono NF</string>
    </edit>
  </match>
</fontconfig>
