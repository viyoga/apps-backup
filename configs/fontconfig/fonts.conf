<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Iosevka NF</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Iosevka NF</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK KR</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK TC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Iosevka NF</string>
    </edit>
  </match>

  <!-- Prevent legacy GNU Free fonts from rendering hollow dots for braille patterns -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>FreeMono</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>FreeSans</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>FreeSerif</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
