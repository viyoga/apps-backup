include colors.conf

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+backspace send_text all \x17


# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

cursor_trail 1
background_opacity 1
background_blur 1

# Font settings
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

#Devanagari
symbol_map U+0900-U+097F,U+A8E0-U+A8FF,U+1CD0-U+1CFF Noto Sans Devanagari


# Window settings
window_padding_width 15
confirm_os_window_close 0
enabled_layouts splits,tall,stack,vertical,horizontal,grid,fat
# Use vertical split instead of horizontal for new windows
map ctrl+shift+enter launch --location=split
# Focus neighboring windows with vim keys
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

startup_session ~/.config/kitty/launch.conf


include themes/noctalia.conf
