[mgr]
ratio = [ 3, 7, 8 ]
sort_by = "mtime"
sort_dir_first = true
sort_reverse = true

[preview]
max_width  = 1200
max_height = 1200

[open]
rules = [
	{ mime = "video/*", use = "mpv" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = "edit" },
	{ mime = "inode/empty", use = "edit" },
	{ url = "*", use = ["open", "reveal"] },
]

[opener]
edit = [
	{ run = "kitty -e nvim %s", desc = "nvim", for = "unix" },
]
mpv = [
	{ run = "nohup mpv %s >/dev/null 2>&1 &", desc = "mpv", for = "unix" },
]
