# --- modern-labwc config ---
input-ipc-server=/tmp/modern_labwc_mpv.sock
osc=no
border=no
keepaspect=yes
force-window=immediate
cursor-autohide=1000
autofit=70%x70%
hwdec=auto-safe

# --- user essentials ---
vo=gpu-next
gpu-context=wayland
fullscreen=no
video-sync=display-resample
hr-seek=yes
target-prim=bt.709
target-trc=srgb

# --- ytdl / streaming ---
ytdl-raw-options=cookies=/home/kabir/.config/yt-x/cookies.txt
ytdl-format=bv[height<=2160][vcodec!=av01]+ba[ext=m4a]/b[height<=2160]

# --- subs ---
slang=en,eng,enUS,en-US
sub-auto=fuzzy

# --- resume playback ---
save-position-on-quit=yes
watch-later-directory=~/.config/mpv/watch_later

# --- subtitle style ---
include=/home/kabir/.config/mpv/mpv-colors.conf

# Scales bitmap (PGS) subtitles, which ignore sub-font-size
sub-scale=0.6
