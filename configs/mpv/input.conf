# Mouse #
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen

# Arrow keys #
LEFT seek -5
RIGHT seek 5
UP add volume 5
DOWN add volume -5

# Wheel #
WHEEL_UP add volume 1
WHEEL_DOWN add volume -1

# Audio tracks
a cycle audio

# Speed controls
. add speed 0.1
, add speed -0.1
> add speed 0.2
< add speed -0.2

# Subtitle sync (seconds)
z add sub-delay -0.2
x add sub-delay 0.2

# Subtitle font size
[ add sub-font-size -1
] add sub-font-size 1
